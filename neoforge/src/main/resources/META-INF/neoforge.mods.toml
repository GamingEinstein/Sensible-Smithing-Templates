modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"

[[mods]]
    modId = "${mod_id}"
    version = "${version}"
    displayName = "${mod_name}"
    displayURL = "https://modrinth.com/mod/sensible-smithing-templates"
    issueTrackerURL = "https://github.com/GamingEinstein/Sensible-Smithing-Templates/issues"
    logoFile = "logo.png"
    credits = "${credits}"
    authors = "${mod_author}"
    description = '''${description}'''
    itemIcon = "minecraft:netherite_upgrade_smithing_template"

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange = "[${neoforge_version},)"
    ordering = "AFTER"
    side = "BOTH"
[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "AFTER"
    side = "BOTH"